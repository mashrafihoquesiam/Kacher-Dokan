server.port=${PORT:3000}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/kaser_dokan}
spring.data.mongodb.database=${DB_NAME:kaser_dokan}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.compression.enabled=true
kacher.auth-secret=${AUTH_SECRET:kaser-dokan-local-auth-secret}
kacher.cloudinary-url=${CLOUDINARY_URL:}
kacher.public-base-url=${PUBLIC_BASE_URL:}
kacher.payment-mode=${PAYMENT_MODE:demo}
